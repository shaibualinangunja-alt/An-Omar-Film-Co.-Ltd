name: FreeCut Windows Release CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop Release (MSVC x64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify Sidecar Binaries (FFmpeg & FFprobe)
        shell: pwsh
        run: |
          $binDir = "src-tauri/binaries"
          if (!(Test-Path $binDir)) { New-Item -ItemType Directory -Path $binDir -Force }
          $ffmpegMsvc = Join-Path $binDir "ffmpeg-x86_64-pc-windows-msvc.exe"
          $ffprobeMsvc = Join-Path $binDir "ffprobe-x86_64-pc-windows-msvc.exe"
          
          if (!(Test-Path $ffmpegMsvc) -or !(Test-Path $ffprobeMsvc)) {
            Write-Host "Downloading official Gyan.dev FFmpeg 8.1.1 essentials build..."
            $zipPath = "$env:TEMP/ffmpeg.zip"
            $extractDir = "$env:TEMP/ffmpeg_extract"
            Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.1-essentials_build.zip" -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
            $foundFfmpeg = Get-ChildItem -Path $extractDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
            $foundFfprobe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
            Copy-Item $foundFfmpeg.FullName $ffmpegMsvc -Force
            Copy-Item $foundFfprobe.FullName $ffprobeMsvc -Force
            Copy-Item $foundFfmpeg.FullName (Join-Path $binDir "ffmpeg.exe") -Force
            Copy-Item $foundFfprobe.FullName (Join-Path $binDir "ffprobe.exe") -Force
          }
          Write-Host "Sidecars verified in $binDir:"
          Get-ChildItem $binDir

      - name: Verify Security & Production Builds
        shell: pwsh
        run: |
          npm run build
          npx tsx test-security-hardening.ts
          npx tsx test-clean-machine-cache.ts
          npx tsx test-relink-media.ts
          npx tsx test-alpha10-step2-bridge.ts
          npx tsx test-playback-engine.ts
          npx tsx test-smoke-alpha10.ts

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^1.5

      - name: Build Windows Tauri Application & Installer (.msi / .exe)
        run: npx @tauri-apps/cli@1 build

      - name: Compute Release Artifact Hashes (SHA-256)
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File
          $artifacts += Get-Item "src-tauri/target/release/freecut.exe" -ErrorAction SilentlyContinue
          $hashes = foreach ($file in $artifacts) {
            $hash = Get-FileHash -Path $file.FullName -Algorithm SHA256
            [PSCustomObject]@{
              FileName = $file.Name
              SizeKB = [math]::Round($file.Length / 1024, 2)
              SHA256 = $hash.Hash
              FullPath = $file.FullName
            }
          }
          $hashes | Format-Table -AutoSize
          $hashes | Out-File "src-tauri/target/release/RELEASE_ARTIFACT_HASHES.txt" -Encoding UTF8

      - name: Upload Windows Installer (.msi / NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: FreeCut-Windows-Installer-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/RELEASE_ARTIFACT_HASHES.txt
          if-no-files-found: error

      - name: Upload Standalone Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: FreeCut-Standalone-Executable-x64
          path: src-tauri/target/release/freecut.exe
          if-no-files-found: warn
