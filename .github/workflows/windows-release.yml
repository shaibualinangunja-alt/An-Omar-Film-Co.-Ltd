name: FreeCut Windows Release CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop Release (MSVC x64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify Sidecar Binaries (FFmpeg & FFprobe)
        shell: pwsh
        run: |
          $binDir = "src-tauri/binaries"
          if (!(Test-Path $binDir)) { New-Item -ItemType Directory -Path $binDir -Force }
          $ffmpegMsvc = Join-Path $binDir "ffmpeg-x86_64-pc-windows-msvc.exe"
          $ffprobeMsvc = Join-Path $binDir "ffprobe-x86_64-pc-windows-msvc.exe"
          
          if (!(Test-Path $ffmpegMsvc) -or !(Test-Path $ffprobeMsvc)) {
            Write-Host "Locating FFmpeg & FFprobe binaries..."
            $sysFfmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
            $sysFfprobe = Get-Command ffprobe -ErrorAction SilentlyContinue
            
            if ($sysFfmpeg -and $sysFfprobe -and (Test-Path $sysFfmpeg.Source) -and (Test-Path $sysFfprobe.Source)) {
              Write-Host "Using system FFmpeg: $($sysFfmpeg.Source)"
              Copy-Item $sysFfmpeg.Source $ffmpegMsvc -Force
              Copy-Item $sysFfprobe.Source $ffprobeMsvc -Force
            } else {
              $zipPath = Join-Path $env:TEMP "ffmpeg.zip"
              $extractDir = Join-Path $env:TEMP "ffmpeg_extract"
              if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
              
              Write-Host "Downloading FFmpeg archive from Gyan.dev..."
              curl.exe -L -f -s -S "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -o $zipPath
              if (!(Test-Path $zipPath) -or ((Get-Item $zipPath).Length -lt 10000000)) {
                Write-Host "Fallback to GitHub BtbN FFmpeg build..."
                curl.exe -L -f -s -S "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o $zipPath
              }
              
              Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
              $foundFfmpeg = Get-ChildItem -Path $extractDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
              $foundFfprobe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
              
              Copy-Item $foundFfmpeg.FullName $ffmpegMsvc -Force
              Copy-Item $foundFfprobe.FullName $ffprobeMsvc -Force
            }
            # Maintain generic names for local test scripts
            Copy-Item $ffmpegMsvc (Join-Path $binDir "ffmpeg.exe") -Force
            Copy-Item $ffprobeMsvc (Join-Path $binDir "ffprobe.exe") -Force
          }
          
          if (!(Test-Path $ffmpegMsvc) -or !(Test-Path $ffprobeMsvc)) {
            throw "Error: FFmpeg or FFprobe sidecars could not be provisioned!"
          }
          Write-Host "Sidecars verified in ${binDir}:"
          Get-ChildItem $binDir
          $absBinDir = (Resolve-Path $binDir).Path
          Write-Host "Adding ${absBinDir} to GITHUB_PATH..."
          $absBinDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Security & Production Builds
        shell: pwsh
        run: |
          npm run build
          npx tsx test-security-hardening.ts
          npx tsx test-clean-machine-cache.ts
          npx tsx test-relink-media.ts
          npx tsx test-alpha10-step2-bridge.ts
          npx tsx test-playback-engine.ts
          npx tsx test-smoke-alpha10.ts

      - name: Build Windows Tauri Application & Installer (.msi)
        run: npx --yes @tauri-apps/cli@1.5.14 build

      - name: Compute Release Artifact Hashes (SHA-256)
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File
          $artifacts += Get-Item "src-tauri/target/release/freecut.exe" -ErrorAction SilentlyContinue
          $hashes = foreach ($file in $artifacts) {
            $hash = Get-FileHash -Path $file.FullName -Algorithm SHA256
            [PSCustomObject]@{
              FileName = $file.Name
              SizeKB = [math]::Round($file.Length / 1024, 2)
              SHA256 = $hash.Hash
              FullPath = $file.FullName
            }
          }
          $hashes | Format-Table -AutoSize
          $hashes | Out-File "src-tauri/target/release/RELEASE_ARTIFACT_HASHES.txt" -Encoding UTF8
          Copy-Item "src-tauri/target/release/RELEASE_ARTIFACT_HASHES.txt" "src-tauri/target/release/bundle/RELEASE_ARTIFACT_HASHES.txt" -Force -ErrorAction SilentlyContinue

      - name: Upload Windows Installer (.msi / bundle)
        uses: actions/upload-artifact@v4
        with:
          name: FreeCut-Windows-Installer-x64
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

      - name: Upload Standalone Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: FreeCut-Standalone-Executable-x64
          path: src-tauri/target/release/freecut.exe
          if-no-files-found: warn
